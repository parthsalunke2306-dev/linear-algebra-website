{% extends 'linear_algebra/base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card p-4 rounded-4 shadow-lg" style="border: 1px solid var(--accent-purple-glow);">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 p-3"
                    style="background: rgba(192, 132, 252, 0.15); border: 1px solid var(--accent-purple);">
                    <i class="bi bi-shield-lock-fill display-5" style="color: var(--accent-purple);"></i>
                </div>
                <h3 class="fw-bold">Sign In to Platform</h3>
                <p class="text-muted small">Access your account, math solvers, and platform tools.</p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger rounded-3 py-2 px-3 small mb-3">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid Username or Password.
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label text-muted small fw-semibold">USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary">
                            <i class="bi bi-person-fill" style="color: var(--accent-purple);"></i>
                        </span>
                        <input type="text" name="username" class="form-control border-start-0" id="id_username" placeholder="e.g. student or admin" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label text-muted small fw-semibold">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-secondary">
                            <i class="bi bi-key-fill" style="color: var(--accent-purple);"></i>
                        </span>
                        <input type="password" name="password" class="form-control border-start-0" id="id_password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient w-100 py-2 font-monospace fw-bold mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> SIGN IN
                </button>
            </form>

            <div class="text-center text-muted small border-top border-secondary pt-3 mt-2">
                Don't have an account yet? <a href="{% url 'linear_algebra:register' %}" class="text-purple fw-bold">Sign Up here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
