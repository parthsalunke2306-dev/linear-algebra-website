{% extends 'linear_algebra/base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-4">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 p-3" style="background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52, 211, 153, 0.35);">
                    <i class="bi bi-shield-check display-5" style="color: var(--accent-emerald);"></i>
                </div>
                <h2 class="fw-bold mb-1">Set New Password</h2>
                <p class="text-muted small">Enter your new secure password below</p>
            </div>

            {% if error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 mb-4 rounded-3 border-0" role="alert" style="background: rgba(239, 68, 68, 0.15); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.3) !important;">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <div class="small">{{ error }}</div>
            </div>
            {% endif %}

            <form method="post" action="{% url 'linear_algebra:reset_password' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-muted border-end-0" style="border-color: var(--glass-border);"><i class="bi bi-key"></i></span>
                        {{ form.new_password }}
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-semibold">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-muted border-end-0" style="border-color: var(--glass-border);"><i class="bi bi-check2-circle"></i></span>
                        {{ form.confirm_password }}
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient w-100 py-2 mb-3">
                    Update Password <i class="bi bi-lock-fill ms-1"></i>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
